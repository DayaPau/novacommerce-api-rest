
openapi: 3.0.3

info:
  title: NovaCommerce Order Management API
  version: 1.0.0
  description: >-
    Contrato de integración REST para que la plataforma de
    comercio electrónico NovaCommerce pueda registrar,
    consultar y actualizar pedidos mediante el Sistema
    Empresarial de Gestión de Pedidos.
    Especificación basada en OpenAPI 3.0.3.

servers:
  - url: http://localhost:8080
    description: Servidor local ilustrativo; no implementado para este taller

tags:
  - name: Orders
    description: Operaciones sobre pedidos

paths:
  /orders:
    post:
      tags: [Orders]
      summary: Crear un pedido
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              customerId: C-1024
              items:
                - productId: P-500
                  quantity: 2
      responses:
        '201':
          description: Pedido creado
          headers:
            Location:
              description: Ruta del pedido creado
              schema:
                type: string
              example: /orders/O-9831
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: O-9831
                customerId: C-1024
                status: CREATED
                total: 129.90

        '400':
          description: Solicitud con datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_ORDER_REQUEST
                message: La cantidad debe ser mayor que cero
                correlationId: abc-123

        '409':
          description: Conflicto de negocio por inventario insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INSUFFICIENT_STOCK
                message: El producto P-500 solo tiene 2 unidades disponibles
                correlationId: abc-124

        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Orders]
      summary: Consultar pedidos filtrados por cliente
      operationId: listOrders
      parameters:
        - name: customerId
          in: query
          required: true
          description: Identificador del cliente cuyos pedidos se consultarán
          schema:
            type: string
            minLength: 1
          example: C-1024
      responses:
        '200':
          description: Lista de pedidos del cliente (puede estar vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              example:
                - id: O-9831
                  customerId: C-1024
                  status: CREATED
                  total: 129.90
                - id: O-9832
                  customerId: C-1024
                  status: CONFIRMED
                  total: 75.50

        '400':
          description: Filtro inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CUSTOMER_ID
                message: Se requiere un identificador de cliente válido
                correlationId: abc-125

        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        description: Identificador del pedido
        schema:
          type: string
          pattern: '^O-[0-9]+$'
        example: O-9831

    get:
      tags: [Orders]
      summary: Consultar un pedido específico
      operationId: getOrder
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: O-9831
                customerId: C-1024
                status: CONFIRMED
                total: 129.90

        '400':
          description: Identificador con formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_ORDER_ID
                message: El identificador debe cumplir el formato O-1234
                correlationId: abc-126

        '404':
          description: Pedido inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ORDER_NOT_FOUND
                message: El pedido O-9999 no existe
                correlationId: abc-127

        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Orders]
      summary: Actualizar el estado de un pedido
      operationId: updateOrderStatus
      description: >-
        Esta versión del contrato permite actualizar únicamente el estado.
        Transiciones permitidas: CREATED a CONFIRMED o CANCELLED;
        CONFIRMED a CANCELLED. Un pedido CANCELLED no admite cambios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
            example:
              status: CONFIRMED
      responses:
        '200':
          description: Estado del pedido actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: O-9831
                customerId: C-1024
                status: CONFIRMED
                total: 129.90

        '400':
          description: Estado enviado inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_STATUS
                message: El estado indicado no es válido
                correlationId: abc-128

        '404':
          description: Pedido inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ORDER_NOT_FOUND
                message: El pedido O-9999 no existe
                correlationId: abc-129

        '409':
          description: Transición de estado no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_STATUS_TRANSITION
                message: Un pedido cancelado no puede confirmarse
                correlationId: abc-130

        '500':
          $ref: '#/components/responses/InternalError'

components:
  responses:
    InternalError:
      description: Error inesperado del proveedor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Ocurrió un error inesperado
            correlationId: abc-500

  schemas:
    OrderItem:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId:
          type: string
          minLength: 1
          example: P-500
        quantity:
          type: integer
          minimum: 1
          example: 2

    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [customerId, items]
      properties:
        customerId:
          type: string
          minLength: 1
          example: C-1024
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'

    Order:
      type: object
      additionalProperties: false
      required: [id, customerId, status, total]
      properties:
        id:
          type: string
          example: O-9831
        customerId:
          type: string
          example: C-1024
        status:
          type: string
          enum: [CREATED, CONFIRMED, CANCELLED]
          example: CREATED
        total:
          type: number
          format: double
          minimum: 0
          example: 129.90

    UpdateOrderStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [CONFIRMED, CANCELLED]
          example: CONFIRMED

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          example: INSUFFICIENT_STOCK
        message:
          type: string
          example: El producto P-500 no tiene stock suficiente
        correlationId:
          type: string
          description: Identificador opcional para rastrear la solicitud
          example: abc-123
